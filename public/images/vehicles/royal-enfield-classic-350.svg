<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" rx="30" fill="#F8FAFC"/>
  <rect x="20" y="20" width="760" height="460" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  <!-- Royal Enfield Classic 350 Motorcycle Graphic -->
  <g transform="translate(150, 100)">
    <!-- Spoked Wheels -->
    <circle cx="80" cy="230" r="65" fill="none" stroke="#1E293B" stroke-width="12"/>
    <circle cx="420" cy="230" r="65" fill="none" stroke="#1E293B" stroke-width="12"/>
    <circle cx="80" cy="230" r="20" fill="#475569"/>
    <circle cx="420" cy="230" r="20" fill="#475569"/>
    <line x1="80" y1="165" x2="80" y2="295" stroke="#94A3B8" stroke-width="3"/>
    <line x1="15" y1="230" x2="145" y2="230" stroke="#94A3B8" stroke-width="3"/>
    <line x1="420" y1="165" x2="420" y2="295" stroke="#94A3B8" stroke-width="3"/>
    <line x1="355" y1="230" x2="485" y2="230" stroke="#94A3B8" stroke-width="3"/>
    <!-- Teardrop Fuel Tank -->
    <path d="M 230 110 Q 300 70 340 120 Q 300 160 220 150 Z" fill="#15803D"/>
    <!-- Engine Block -->
    <rect x="230" y="155" width="80" height="75" rx="8" fill="#475569"/>
    <!-- Exhaust Pipe -->
    <path d="M 270 210 L 450 210" stroke="#94A3B8" stroke-width="14" stroke-linecap="round"/>
    <!-- Handlebar & Headlight -->
    <line x1="340" y1="120" x2="380" y2="50" stroke="#334155" stroke-width="8"/>
    <circle cx="390" cy="55" r="18" fill="#FEF08A" stroke="#CA8A04" stroke-width="4"/>
    <!-- Split Leather Seat -->
    <path d="M 140 135 Q 200 120 230 145 Z" fill="#78350F"/>
    <text x="250" y="310" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#0F172A" text-anchor="middle">ROYAL ENFIELD CLASSIC 350</text>
    <text x="250" y="335" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">349cc Cruiser Motorcycle • RideSetu Verified</text>
  </g>
</svg>
